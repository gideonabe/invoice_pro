name: Deploy InvoicePro

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: invoicepro
  CONTAINER_NAME: invoicepro
  CONTAINER_PORT: 3000

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # AWS OIDC authentication
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # -----------------------------
      # Login to ECR
      # -----------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------
      # Build + Push
      # -----------------------------
      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Building:"
          echo "$IMAGE_URI"

          docker build \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Deploy through SSM
      # -----------------------------
      - name: Deploy to EC2
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.IMAGE_URI }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy InvoicePro ${{ github.sha }}" \
            --parameters commands="[
              \"set -e\",
              \"echo 'Logging into ECR...'\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(echo $IMAGE_URI | cut -d/ -f1)\",
              \"echo 'Pulling $IMAGE_URI...'\",
              \"docker pull $IMAGE_URI\",
              \"echo 'Stopping current container...'\",
              \"docker stop $CONTAINER_NAME 2>/dev/null || true\",
              \"docker rm $CONTAINER_NAME 2>/dev/null || true\",
              \"echo 'Starting new container...'\",
              \"docker run -d --name $CONTAINER_NAME --restart unless-stopped --env-file /home/ec2-user/invoice_pro/.env.production -p 127.0.0.1:$CONTAINER_PORT:$CONTAINER_PORT $IMAGE_URI\",
              \"echo 'Waiting for application...'\",
              \"sleep 10\",
              \"echo 'Container status:'\",
              \"docker ps --filter name=$CONTAINER_NAME\",
              \"echo 'Deployment finished.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi
