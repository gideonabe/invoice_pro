name: Inspect EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inspect running container
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Inspect InvoicePro deployment" \
            --parameters commands='[
              "echo === CONTAINERS ===",
              "docker ps -a --format \"table {{.Names}}\\t{{.Image}}\\t{{.Ports}}\\t{{.Status}}\"",
              "echo === INVOICEPRO CONTAINER ===",
              "docker inspect invoicepro --format \"Image={{.Config.Image}}\"",
              "docker inspect invoicepro --format \"RestartPolicy={{.HostConfig.RestartPolicy.Name}}\"",
              "docker inspect invoicepro --format \"EnvFile={{range .Config.Env}}{{println .}}{{end}}\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          echo "===== EC2 OUTPUT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
